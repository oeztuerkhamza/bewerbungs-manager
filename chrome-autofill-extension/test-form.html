<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bewerbungsformular – Test</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f4f6f9; color: #1f1f1f; min-height: 100vh; display: flex; justify-content: center; padding: 40px 20px; }
    .form-container { width: 100%; max-width: 640px; background: #fff; border-radius: 16px; padding: 40px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    h1 { font-size: 24px; color: #1B3764; margin-bottom: 8px; }
    p.desc { font-size: 14px; color: #666; margin-bottom: 28px; }
    .form-group { margin-bottom: 20px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; }
    input, select, textarea {
      width: 100%; padding: 10px 14px; border: 1.5px solid #d0d4dd; border-radius: 8px;
      font-family: 'Inter', sans-serif; font-size: 14px; color: #1f1f1f;
      transition: border-color 0.2s, box-shadow 0.2s; outline: none; background: #fafbfd;
    }
    input:focus, select:focus, textarea:focus { border-color: #2C5AA0; box-shadow: 0 0 0 3px rgba(44,90,160,0.1); }
    textarea { resize: vertical; min-height: 80px; }
    .divider { height: 1px; background: #e8ebf0; margin: 28px 0; }
    h2 { font-size: 16px; color: #1B3764; margin-bottom: 16px; }
    .badge { display: inline-block; background: #EBF0F8; color: #1B3764; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px; margin-bottom: 16px; }
    .note { background: #fff8e6; border: 1px solid #f0d88a; border-radius: 8px; padding: 12px 16px; font-size: 12px; color: #856404; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="form-container">
    <h1>Bewerbungsformular</h1>
    <p class="desc">Testformular zum Ausprobieren der AutoFill-Extension</p>
    <span class="badge">🧪 Testmodus</span>

    <form>
      <h2>Persönliche Daten</h2>
      <div class="form-row">
        <div class="form-group">
          <label for="vorname">Vorname</label>
          <input type="text" id="vorname" name="vorname" placeholder="Max">
        </div>
        <div class="form-group">
          <label for="nachname">Nachname</label>
          <input type="text" id="nachname" name="nachname" placeholder="Mustermann">
        </div>
      </div>
      <div class="form-group">
        <label for="email">E-Mail-Adresse</label>
        <input type="email" id="email" name="email" placeholder="max@beispiel.de">
      </div>
      <div class="form-group">
        <label for="telefon">Telefonnummer</label>
        <input type="tel" id="telefon" name="telefon" placeholder="+49 123 4567890">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="strasse">Straße & Hausnummer</label>
          <input type="text" id="strasse" name="strasse" placeholder="Musterstr. 1">
        </div>
        <div class="form-group">
          <label for="plz">PLZ</label>
          <input type="text" id="plz" name="plz" placeholder="79098">
        </div>
      </div>
      <div class="form-group">
        <label for="ort">Ort</label>
        <input type="text" id="ort" name="ort" placeholder="Freiburg">
      </div>

      <div class="divider"></div>

      <h2>Berufliche Angaben</h2>
      <div class="form-group">
        <label for="position">Position / Stellenbezeichnung</label>
        <input type="text" id="position" name="position" placeholder="Fullstack Entwickler">
      </div>
      <div class="form-group">
        <label for="arbeitgeber">Aktueller Arbeitgeber</label>
        <input type="text" id="arbeitgeber" name="arbeitgeber" placeholder="Firma GmbH">
      </div>
      <div class="form-group">
        <label for="linkedin">LinkedIn-Profil</label>
        <input type="url" id="linkedin" name="linkedin" placeholder="https://linkedin.com/in/...">
      </div>
      <div class="form-group">
        <label for="github">GitHub-Profil</label>
        <input type="url" id="github" name="github" placeholder="https://github.com/...">
      </div>
      <div class="form-group">
        <label for="website">Persönliche Website</label>
        <input type="url" id="website" name="website" placeholder="https://...">
      </div>

      <div class="divider"></div>

      <h2>Weitere Angaben</h2>
      <div class="form-group">
        <label for="gehaltsvorstellung">Gehaltsvorstellung</label>
        <input type="text" id="gehaltsvorstellung" name="gehalt" placeholder="z.B. 55.000 € brutto/Jahr">
      </div>
      <div class="form-group">
        <label for="eintrittsdatum">Frühester Eintrittstermin</label>
        <input type="text" id="eintrittsdatum" name="eintritt" placeholder="z.B. sofort / 01.06.2026">
      </div>
      <div class="form-group">
        <label for="anschreiben">Anschreiben / Nachricht</label>
        <textarea id="anschreiben" name="anschreiben" placeholder="Warum möchten Sie sich bewerben?"></textarea>
      </div>
    </form>

    <div class="note">
      💡 <strong>Tipp:</strong> Klicke auf das AutoFill-Icon in der Chrome-Toolbar und dann auf „Formular ausfüllen", um dieses Formular automatisch auszufüllen.
    </div>
  </div>
</body>
</html>
